name: Update LangChain documentation

on:
  schedule:
    # GitHub Actions cron schedules use UTC. Run once a week, on Monday.
    - cron: "23 04 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-langchain-documentation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # The full set is 8703 pages. A hosted runner reached 6405 of them in 60
    # minutes, so the download alone needs about 95 before normalization starts.
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install updater dependencies
        run: python -m pip install -r requirements.txt

      - name: Test Markdown normalization
        run: python -m unittest discover -s tests

      - name: Update documentation mirror
        run: python update_docs.py

      - name: Commit and push changes
        shell: bash
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            trigger="scheduled"
          else
            trigger="$GITHUB_EVENT_NAME by $GITHUB_ACTOR"
          fi
          git commit -m "docs: automated update $(date -u +%F) ($trigger)"
          git push
