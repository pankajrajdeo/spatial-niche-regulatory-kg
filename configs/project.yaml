at1_scope:
  cell_type: AT1
  # Fixed manuscript TFs; seed order is not a scientific ranking.
  tf_seeds: [TEAD1, KLF5, GATA6, FOXA2, ETV1]

tolerances:
  signature_effect_abs: 1.0e-8
  signature_effect_rel: 1.0e-6
  neighborhood_row_sum: 1.0e-6
