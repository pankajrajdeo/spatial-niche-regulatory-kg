# Project-data ingestion (package P1). Relative paths resolve against the repository root.
# Unknown fields are rejected.
schema_version: 1
input_mode: real
data_root: data
ingest_chunk_rows: 2000   # performance only; excluded from the artifact key

dataset:
  name: Yale
  species: Homo sapiens
  ncbi_taxon_id: 9606
  tissue: lung
  # Niches were clustered from Control and IPF lung tissue sections (final synthesis,
  # "Authoritative project-data update" §1); no cultured or engineered model is involved.
  model_system: primary tissue
  conditions:
    Control:
      disease: null        # experimental control condition; no diagnosis is asserted
    IPF:
      disease: idiopathic pulmonary fibrosis

chromlinker:
  path: files/Yale_IPF_with_Niches_tf_to_gene_connection_scores_log10.csv
  delimiter: ","
  tf_column: TF
  target_column: Gene
  # Name taken from the source filename. Transform, zero meaning, and aggregation are unconfirmed.
  score_label: tf_to_gene_connection_score_log10

expression:
  path: files/spatial_niche_pseudobulk_CPTT.txt
  delimiter: "\t"          # tab separated despite the .txt extension
  gene_column: gene
  value_unit: CPTT

niche_expression_signatures:
  path: files/Yale_pooled_niche_expression_signatures.tsv
  delimiter: "\t"

# One condition-pooled niche definition run per focal cell type. k and resolution are stated
# here explicitly and cross-checked against each filename.
niche_definitions:
  - focal_cell_type: AT1
    neighborhood_path: files/Neighbour_celltypes/AT1_knn_25_res0.08_neighbor_mean_counts_by_niche.tsv
    delimiter: "\t"
    niche_column: spatial_niche
    k_neighbors: 25
    clustering_resolution: 0.08
    conditions_pooled: [Control, IPF]
    method: knn_neighbor_celltype_composition_clustering
  - focal_cell_type: Activated_Fibrotic_FBs
    neighborhood_path: files/Neighbour_celltypes/Activated_Fibrotic_FBs_knn_25_res0.1_neighbor_mean_counts_by_niche.tsv
    delimiter: "\t"
    niche_column: spatial_niche
    k_neighbors: 25
    clustering_resolution: 0.1
    conditions_pooled: [Control, IPF]
    method: knn_neighbor_celltype_composition_clustering
  - focal_cell_type: Alveolar_Macrophages
    neighborhood_path: files/Neighbour_celltypes/Alveolar_Macrophages_knn_25_res0.08_neighbor_mean_counts_by_niche.tsv
    delimiter: "\t"
    niche_column: spatial_niche
    k_neighbors: 25
    clustering_resolution: 0.08
    conditions_pooled: [Control, IPF]
    method: knn_neighbor_celltype_composition_clustering
  - focal_cell_type: KRT5neg_KRT17pos
    neighborhood_path: files/Neighbour_celltypes/KRT5neg_KRT17pos_knn_25_res0.15_neighbor_mean_counts_by_niche.tsv
    delimiter: "\t"
    niche_column: spatial_niche
    k_neighbors: 25
    clustering_resolution: 0.15
    conditions_pooled: [Control, IPF]
    method: knn_neighbor_celltype_composition_clustering

