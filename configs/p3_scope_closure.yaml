# Validation selection: <= 10 papers / 20 bundles. `purpose`: genuine_evidence (extract with preserved
# uncertainty), negative_control (a named interpretation must be rejected), abstention_test (no positive
# regulatory extraction from this bundle as it stands). `coverage` of each association:
# exact_population (the manuscript cell type is stated for it in the parts), adjacent_population (same
# lineage family, not the manuscript state), transferable_other_tissue, or not_applicable (controls).
selection:
  - payload_id: payload:576ae764b51f21593afb
    associations: [[Alveolar_Macrophages, HGNC:3239]]
    purpose: genuine_evidence
    coverage: exact_population
    may_extract: [EGR2 described by the authors as a direct DNA-binding TF in AMs required for chromatin openness (author conclusion)]
    must_remain_unknown: [experimental species, assay supporting the conclusion (outside this part), target genes]
    must_reject: [resolved human EGR2 identity, target-gene regulation claims]
  - payload_id: payload:d2b8ce560af2ad5925b9
    associations: [[Alveolar_Macrophages, HGNC:3239]]
    purpose: genuine_evidence
    coverage: exact_population
    may_extract: [EGR2 deficiency impairs zymosan internalization in AMs, EGR2 as likely direct proximal activator (abstract-level; RNA-seq/ATAC-seq/CUT&RUN)]
    must_remain_unknown: [species of these experiments (the "in mice" sentence cites earlier work), per-target effect sizes]
    must_reject: [predicted direct targets reported as verified regulation, attributing the earlier mouse finding to this study]
  - payload_id: payload:a128f28b1f4cbce9f882
    associations: [[Alveolar_Macrophages, HGNC:3239]]
    purpose: genuine_evidence
    coverage: exact_population
    may_extract: [cell-intrinsic EGR2 is required for AM tissue-specific identity (abstract-level), EGR2 driven by TGF-beta and GM-CSF in a PPAR-gamma-dependent manner]
    must_remain_unknown: [experimental species, assays, donor/animal counts]
    must_reject: ['"evolutionarily conserved" as human experimental evidence', resolved human identity from the source annotation]
