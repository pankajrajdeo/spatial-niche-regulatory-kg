# How the audit set was chosen (diagnostic, not recall):
# - all 20 `direct_context_not_in_pool` associations of snapshot-p3-pilot-proposal-2 (17 bundles, 9 papers);
# - up to six KRT and six activated-fibroblast bundles outside the earlier selection, from all 3,766 bundles
#   with that lineage association: anchor/parts naming the cell class (ontology source_context), then lung
#   tissue, then a named manuscript TF, then a source-result attribution, then readiness, then PMID order.
#   No bundle names the exact KRT5-/KRT17+ or activated/fibrotic population, so all 12 are broad-class.
audit_selection_rule: >-
  direct_context_not_in_pool (all) + top six KRT5neg_KRT17pos and top six Activated_Fibrotic_FBs bundles by
  (exact>broad cell mention, lung tissue, named TF, source_result_candidate, READY first, PMID)

