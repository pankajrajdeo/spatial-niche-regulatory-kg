# bundle's own parts; `regkg literature scope-closure` rejects the file otherwise. A dimension without a
# span in the bundle parts is "unknown" even when the title or other sections suggest a value.
schema_version: 1
rule: p3-scope-closure-1
status: proposed_pending_lead_review
