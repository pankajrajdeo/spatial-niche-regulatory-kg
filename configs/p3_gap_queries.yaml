# Bounded gap-directed queue for the two lineages with no exact-population evidence in the corpus
# (P3 source-gap completion, item 4). Separate from the accepted P2 queue, which is not modified.
# Terms are exact population synonyms (ontology labels/EXACT synonyms and manuscript spellings) crossed
# with the named regulator of that lineage. A query that returns nothing means missing literature
# support in these sources, never biological absence.
schema_version: 1
rule: p3-gap-queries-1
status: proposed_pending_lead_review
acquisition_cap: 20
queries:
  - query_id: gap-KRT5neg_KRT17pos-HGNC:11714
    cell_type: KRT5neg_KRT17pos
    tf_hgnc_id: HGNC:11714
    terms:
      tf: [TEAD1, TCF13, TEF-1]
      target: []
      qualifiers: [aberrant basaloid, KRT5-/KRT17+, KRT17+/KRT5-, aberrant basal-like, basaloid cell]
